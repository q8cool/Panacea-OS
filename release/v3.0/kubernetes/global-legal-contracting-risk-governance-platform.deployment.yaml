apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-legal-governance
  labels:
    app.kubernetes.io/name: panacea-global-legal-governance
    app.kubernetes.io/component: legal-contracting-risk-governance
    app.kubernetes.io/part-of: panacea-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-legal-governance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-legal-governance
    spec:
      containers:
        - name: global-legal-governance
          image: panacea/global-legal-contracting-risk-governance-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8142
          env:
            - name: PANACEA_GLOBAL_LEGAL_PORT
              value: "8142"
            - name: GLOBAL_LEGAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-legal-db
                  key: database-url
            - name: PANACEA_FOUNDATION_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: foundation-url
            - name: PANACEA_SECURITY_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: security-url
            - name: PANACEA_COMPLIANCE_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: compliance-url
            - name: PANACEA_QUALITY_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: quality-url
            - name: PANACEA_GLOBAL_WORKFORCE_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: global-workforce-url
            - name: PANACEA_GLOBAL_SUPPLY_CHAIN_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: global-supply-chain-url
            - name: PANACEA_REVENUE_CYCLE_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: revenue-cycle-url
            - name: PANACEA_ENTERPRISE_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: enterprise-url
            - name: PANACEA_AUDIT_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: audit-url
            - name: PANACEA_NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: notification-url
          readinessProbe:
            httpGet:
              path: /api/v3/global-legal-governance/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v3/global-legal-governance/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-legal-governance
  labels:
    app.kubernetes.io/name: panacea-global-legal-governance
spec:
  selector:
    app.kubernetes.io/name: panacea-global-legal-governance
  ports:
    - name: http
      port: 8142
      targetPort: http
