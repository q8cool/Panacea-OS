# Panacea OS UTBE controlled pilot reverse proxy.
# No secrets are stored here. TLS paths are placeholders for operator-issued certificates.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream panacea_web {
  server 127.0.0.1:5174;
}

upstream panacea_autonomous_healthcare_intelligence {
  server 127.0.0.1:18094;
}

upstream panacea_global_command_intelligence {
  server 127.0.0.1:18095;
}

upstream panacea_global_workforce {
  server 127.0.0.1:18141;
}

upstream panacea_global_legal_governance {
  server 127.0.0.1:18142;
}

upstream panacea_global_customer_success {
  server 127.0.0.1:18143;
}

upstream panacea_global_product_management {
  server 127.0.0.1:18144;
}

upstream panacea_global_compliance {
  server 127.0.0.1:18145;
}

upstream panacea_global_ai_assurance {
  server 127.0.0.1:18146;
}

upstream panacea_global_privacy {
  server 127.0.0.1:18147;
}

server {
  listen 80;
  server_name panacea.utbe.ai api.panacea.utbe.ai;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name panacea.utbe.ai;

  ssl_certificate /etc/letsencrypt/live/panacea.utbe.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/panacea.utbe.ai/privkey.pem;

  client_max_body_size 25m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://panacea_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 443 ssl http2;
  server_name api.panacea.utbe.ai;

  ssl_certificate /etc/letsencrypt/live/api.panacea.utbe.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.panacea.utbe.ai/privkey.pem;

  client_max_body_size 25m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Access-Control-Allow-Origin "https://panacea.utbe.ai" always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-ID, X-Request-ID" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location /api/v4/autonomous-healthcare-intelligence/ {
    proxy_pass http://panacea_autonomous_healthcare_intelligence;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /api/v4/global-command-intelligence/ {
    proxy_pass http://panacea_global_command_intelligence;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /api/v3/global-workforce/ {
    proxy_pass http://panacea_global_workforce;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-legal-governance/ {
    proxy_pass http://panacea_global_legal_governance;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-customer-success/ {
    proxy_pass http://panacea_global_customer_success;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-product-management/ {
    proxy_pass http://panacea_global_product_management;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-compliance/ {
    proxy_pass http://panacea_global_compliance;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-ai-assurance/ {
    proxy_pass http://panacea_global_ai_assurance;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v3/global-privacy/ {
    proxy_pass http://panacea_global_privacy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
