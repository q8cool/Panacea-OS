name: panacea-pilot

networks:
  panacea-pilot:
    name: panacea-pilot

volumes:
  panacea-pilot-postgres:
  panacea-pilot-backups:

x-foundation-provider-env: &foundation-provider-env
  PANACEA_RUNTIME_MODE: ${PANACEA_RUNTIME_MODE:?Set PANACEA_RUNTIME_MODE}
  PANACEA_PUBLIC_WEB_URL: ${PANACEA_PUBLIC_WEB_URL:?Set PANACEA_PUBLIC_WEB_URL}
  PANACEA_API_PUBLIC_BASE_URL: ${PANACEA_API_PUBLIC_BASE_URL:?Set PANACEA_API_PUBLIC_BASE_URL}
  PANACEA_CORS_ALLOWED_ORIGINS: ${PANACEA_CORS_ALLOWED_ORIGINS:?Set PANACEA_CORS_ALLOWED_ORIGINS}
  PANACEA_JWT_ISSUER: ${PANACEA_JWT_ISSUER:?Set PANACEA_JWT_ISSUER}
  PANACEA_JWT_AUDIENCE: ${PANACEA_JWT_AUDIENCE:?Set PANACEA_JWT_AUDIENCE}
  PANACEA_LOG_LEVEL: ${PANACEA_LOG_LEVEL:-info}
  PANACEA_FOUNDATION_URL: ${PANACEA_FOUNDATION_URL:?Set PANACEA_FOUNDATION_URL}
  PANACEA_FOUNDATION_JWT_ISSUER: ${PANACEA_FOUNDATION_JWT_ISSUER:?Set PANACEA_FOUNDATION_JWT_ISSUER}
  PANACEA_FOUNDATION_JWKS_URL: ${PANACEA_FOUNDATION_JWKS_URL:?Set PANACEA_FOUNDATION_JWKS_URL}
  PANACEA_FOUNDATION_AUDIT_APPEND_PATH: ${PANACEA_FOUNDATION_AUDIT_APPEND_PATH:?Set PANACEA_FOUNDATION_AUDIT_APPEND_PATH}
  PANACEA_FOUNDATION_POLICY_EVALUATION_PATH: ${PANACEA_FOUNDATION_POLICY_EVALUATION_PATH:?Set PANACEA_FOUNDATION_POLICY_EVALUATION_PATH}
  PANACEA_FOUNDATION_HEALTH_PATH: ${PANACEA_FOUNDATION_HEALTH_PATH:?Set PANACEA_FOUNDATION_HEALTH_PATH}
  PANACEA_FOUNDATION_READY_PATH: ${PANACEA_FOUNDATION_READY_PATH:?Set PANACEA_FOUNDATION_READY_PATH}
  PANACEA_FOUNDATION_METRICS_PATH: ${PANACEA_FOUNDATION_METRICS_PATH:?Set PANACEA_FOUNDATION_METRICS_PATH}
  PANACEA_FOUNDATION_TIMEOUT_MS: ${PANACEA_FOUNDATION_TIMEOUT_MS:-3000}
  PANACEA_FOUNDATION_RETRY_ATTEMPTS: ${PANACEA_FOUNDATION_RETRY_ATTEMPTS:-2}
  PANACEA_FOUNDATION_RETRY_BACKOFF_MS: ${PANACEA_FOUNDATION_RETRY_BACKOFF_MS:-250}
  PANACEA_FOUNDATION_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${PANACEA_FOUNDATION_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
  PANACEA_FOUNDATION_CIRCUIT_BREAKER_RESET_MS: ${PANACEA_FOUNDATION_CIRCUIT_BREAKER_RESET_MS:-30000}

x-service-common: &service-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - panacea-pilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: panacea-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - panacea-pilot
    volumes:
      - panacea-pilot-postgres:/var/lib/postgresql/data
      - panacea-pilot-backups:${PANACEA_BACKUP_DIR:-/backups/panacea}

  autonomous-healthcare-intelligence-foundation:
    <<: *service-common
    build:
      context: ../../../services/autonomous-healthcare-intelligence-foundation
      dockerfile: Dockerfile
    image: panacea-pilot/autonomous-healthcare-intelligence-foundation:${PANACEA_IMAGE_TAG:-pilot}
    container_name: panacea-pilot-autonomous-healthcare-intelligence-foundation
    environment:
      <<: *foundation-provider-env
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PORT: 8094
    ports:
      - "127.0.0.1:${PANACEA_PORT_AUTONOMOUS_HEALTHCARE_INTELLIGENCE:-18094}:8094"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8094/api/v4/autonomous-healthcare-intelligence/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  real-time-global-healthcare-command-intelligence-platform:
    <<: *service-common
    build:
      context: ../../../services/real-time-global-healthcare-command-intelligence-platform
      dockerfile: Dockerfile
    image: panacea-pilot/real-time-global-healthcare-command-intelligence-platform:${PANACEA_IMAGE_TAG:-pilot}
    container_name: panacea-pilot-real-time-global-healthcare-command-intelligence-platform
