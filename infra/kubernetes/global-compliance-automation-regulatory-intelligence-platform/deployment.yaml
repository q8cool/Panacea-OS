apiVersion: v1
kind: ConfigMap
metadata:
  name: panacea-global-compliance-config
  labels:
    app.kubernetes.io/name: panacea-global-compliance
    app.kubernetes.io/part-of: panacea-os
    app.kubernetes.io/component: compliance-automation-regulatory-intelligence
    tenant-isolation: required
data:
  PANACEA_GLOBAL_COMPLIANCE_PORT: "8145"
  PORT: "8145"
  PANACEA_FOUNDATION_URL: "http://panacea-foundation:8080"
  PANACEA_AUDIT_URL: "http://panacea-audit:8080"
  PANACEA_NOTIFICATION_URL: "http://panacea-notification:8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-compliance
  labels:
    app.kubernetes.io/name: panacea-global-compliance
    app.kubernetes.io/component: compliance-automation-regulatory-intelligence
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-compliance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-compliance
        app.kubernetes.io/component: compliance-automation-regulatory-intelligence
        app.kubernetes.io/part-of: panacea-os
        tenant-isolation: required
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance-automation-regulatory-intelligence
          image: panacea/global-compliance-automation-regulatory-intelligence-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8145
          envFrom:
            - configMapRef:
                name: panacea-global-compliance-config
          env:
            - name: GLOBAL_COMPLIANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-compliance-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v3/global-compliance/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v3/global-compliance/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-compliance
  labels:
    app.kubernetes.io/name: panacea-global-compliance
    app.kubernetes.io/component: compliance-automation-regulatory-intelligence
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  selector:
    app.kubernetes.io/name: panacea-global-compliance
  ports:
    - name: http
      port: 8145
      targetPort: http
