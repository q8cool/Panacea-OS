apiVersion: v1
kind: ConfigMap
metadata:
  name: panacea-global-ai-assurance-config
  labels:
    app.kubernetes.io/name: panacea-global-ai-assurance
    app.kubernetes.io/part-of: panacea-os
    app.kubernetes.io/component: ai-assurance-safety-model-risk-management
    tenant-isolation: required
data:
  PANACEA_GLOBAL_AI_ASSURANCE_PORT: "8146"
  PORT: "8146"
  PANACEA_FOUNDATION_URL: "http://panacea-foundation:8080"
  PANACEA_AUDIT_URL: "http://panacea-audit:8080"
  PANACEA_NOTIFICATION_URL: "http://panacea-notification:8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-ai-assurance
  labels:
    app.kubernetes.io/name: panacea-global-ai-assurance
    app.kubernetes.io/component: ai-assurance-safety-model-risk-management
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-ai-assurance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-ai-assurance
        app.kubernetes.io/component: ai-assurance-safety-model-risk-management
        app.kubernetes.io/part-of: panacea-os
        tenant-isolation: required
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-assurance-safety-model-risk-management
          image: panacea/global-ai-assurance-safety-model-risk-management-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8146
          envFrom:
            - configMapRef:
                name: panacea-global-ai-assurance-config
          env:
            - name: GLOBAL_AI_ASSURANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-ai-assurance-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v3/global-ai-assurance/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v3/global-ai-assurance/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-ai-assurance
  labels:
    app.kubernetes.io/name: panacea-global-ai-assurance
    app.kubernetes.io/component: ai-assurance-safety-model-risk-management
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  selector:
    app.kubernetes.io/name: panacea-global-ai-assurance
  ports:
    - name: http
      port: 8146
      targetPort: http
