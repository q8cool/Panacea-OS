apiVersion: v1
kind: ConfigMap
metadata:
  name: panacea-global-command-intelligence-config
  labels:
    app.kubernetes.io/name: panacea-global-command-intelligence
    app.kubernetes.io/part-of: panacea-os
    app.kubernetes.io/component: real-time-global-healthcare-command-intelligence
    tenant-isolation: required
data:
  PORT: "8095"
  PORT: "8095"
  PANACEA_FOUNDATION_URL: "http://panacea-foundation:8080"
  PANACEA_AUDIT_URL: "http://panacea-audit:8080"
  PANACEA_NOTIFICATION_URL: "http://panacea-notification:8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-command-intelligence
  labels:
    app.kubernetes.io/name: panacea-global-command-intelligence
    app.kubernetes.io/component: real-time-global-healthcare-command-intelligence
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-command-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-command-intelligence
        app.kubernetes.io/component: real-time-global-healthcare-command-intelligence
        app.kubernetes.io/part-of: panacea-os
        tenant-isolation: required
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: real-time-global-healthcare-command-intelligence
          image: panacea/real-time-global-healthcare-command-intelligence-platform:4.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: panacea-global-command-intelligence-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-command-intelligence-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v4/global-command-intelligence/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v4/global-command-intelligence/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-command-intelligence
  labels:
    app.kubernetes.io/name: panacea-global-command-intelligence
    app.kubernetes.io/component: real-time-global-healthcare-command-intelligence
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  selector:
    app.kubernetes.io/name: panacea-global-command-intelligence
  ports:
    - name: http
      port: 8095
      targetPort: http
