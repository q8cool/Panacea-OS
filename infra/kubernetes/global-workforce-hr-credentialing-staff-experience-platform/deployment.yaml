apiVersion: v1
kind: ConfigMap
metadata:
  name: panacea-global-workforce-config
  labels:
    app.kubernetes.io/name: panacea-global-workforce
    app.kubernetes.io/part-of: panacea-os
    app.kubernetes.io/component: workforce-hr-credentialing-staff-experience
    tenant-isolation: required
data:
  PANACEA_GLOBAL_WORKFORCE_PORT: "8141"
  PORT: "8141"
  PANACEA_FOUNDATION_URL: "http://panacea-foundation:8080"
  PANACEA_FOUNDATION_JWT_ISSUER: "https://foundation.panacea.local"
  PANACEA_FOUNDATION_JWKS_URL: "http://panacea-foundation:8080/.well-known/jwks.json"
  PANACEA_FOUNDATION_AUDIT_APPEND_PATH: "/api/v1/foundation/audit/events"
  PANACEA_FOUNDATION_POLICY_EVALUATION_PATH: "/api/v1/foundation/access/evaluate"
  PANACEA_FOUNDATION_HEALTH_PATH: "/api/v1/foundation/live"
  PANACEA_FOUNDATION_READY_PATH: "/api/v1/foundation/ready"
  PANACEA_FOUNDATION_METRICS_PATH: "/api/v1/foundation/metrics"
  PANACEA_FOUNDATION_TIMEOUT_MS: "2000"
  PANACEA_FOUNDATION_RETRY_ATTEMPTS: "2"
  PANACEA_FOUNDATION_RETRY_BACKOFF_MS: "100"
  PANACEA_FOUNDATION_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "3"
  PANACEA_FOUNDATION_CIRCUIT_BREAKER_RESET_MS: "30000"
  PANACEA_AUDIT_URL: "http://panacea-audit:8080"
  PANACEA_NOTIFICATION_URL: "http://panacea-notification:8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-workforce
  labels:
    app.kubernetes.io/name: panacea-global-workforce
    app.kubernetes.io/component: workforce-hr-credentialing-staff-experience
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-workforce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-workforce
        app.kubernetes.io/component: workforce-hr-credentialing-staff-experience
        app.kubernetes.io/part-of: panacea-os
        tenant-isolation: required
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workforce-hr-credentialing-staff-experience
          image: panacea/global-workforce-hr-credentialing-staff-experience-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8141
          envFrom:
            - configMapRef:
                name: panacea-global-workforce-config
          env:
            - name: GLOBAL_WORKFORCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-workforce-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v3/global-workforce/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v3/global-workforce/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-workforce
  labels:
    app.kubernetes.io/name: panacea-global-workforce
    app.kubernetes.io/component: workforce-hr-credentialing-staff-experience
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  selector:
    app.kubernetes.io/name: panacea-global-workforce
  ports:
    - name: http
      port: 8141
      targetPort: http
