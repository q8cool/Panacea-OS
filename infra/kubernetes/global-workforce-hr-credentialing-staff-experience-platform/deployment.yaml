apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-workforce
  labels:
    app.kubernetes.io/name: panacea-global-workforce
    app.kubernetes.io/component: workforce-hr-credentialing-staff-experience
    app.kubernetes.io/part-of: panacea-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-workforce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-workforce
    spec:
      containers:
        - name: global-workforce
          image: panacea/global-workforce-hr-credentialing-staff-experience-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8141
          env:
            - name: PANACEA_GLOBAL_WORKFORCE_PORT
              value: "8141"
            - name: GLOBAL_WORKFORCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-workforce-db
                  key: database-url
            - name: PANACEA_FOUNDATION_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: foundation-url
            - name: PANACEA_SECURITY_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: security-url
            - name: PANACEA_SCHEDULING_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: scheduling-url
            - name: PANACEA_NURSING_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: nursing-url
            - name: PANACEA_GLOBAL_EDUCATION_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: global-education-url
            - name: PANACEA_QUALITY_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: quality-url
            - name: PANACEA_ENTERPRISE_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: enterprise-url
            - name: PANACEA_ANALYTICS_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: analytics-url
            - name: PANACEA_AUDIT_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: audit-url
            - name: PANACEA_NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: panacea-platform-endpoints
                  key: notification-url
          readinessProbe:
            httpGet:
              path: /api/v3/global-workforce/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v3/global-workforce/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-workforce
  labels:
    app.kubernetes.io/name: panacea-global-workforce
spec:
  selector:
    app.kubernetes.io/name: panacea-global-workforce
  ports:
    - name: http
      port: 8141
      targetPort: http
