apiVersion: v1
kind: ConfigMap
metadata:
  name: panacea-global-product-management-config
  labels:
    app.kubernetes.io/name: panacea-global-product-management
    app.kubernetes.io/part-of: panacea-os
    app.kubernetes.io/component: product-management-roadmap-innovation-portfolio
    tenant-isolation: required
data:
  PANACEA_GLOBAL_PRODUCT_MANAGEMENT_PORT: "8144"
  PORT: "8144"
  PANACEA_FOUNDATION_URL: "http://panacea-foundation:8080"
  PANACEA_AUDIT_URL: "http://panacea-audit:8080"
  PANACEA_NOTIFICATION_URL: "http://panacea-notification:8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panacea-global-product-management
  labels:
    app.kubernetes.io/name: panacea-global-product-management
    app.kubernetes.io/component: product-management-roadmap-innovation-portfolio
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: panacea-global-product-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panacea-global-product-management
        app.kubernetes.io/component: product-management-roadmap-innovation-portfolio
        app.kubernetes.io/part-of: panacea-os
        tenant-isolation: required
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-management-roadmap-innovation-portfolio
          image: panacea/global-product-management-roadmap-innovation-portfolio-platform:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8144
          envFrom:
            - configMapRef:
                name: panacea-global-product-management-config
          env:
            - name: GLOBAL_PRODUCT_MANAGEMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panacea-global-product-management-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/v3/global-product-management/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v3/global-product-management/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: panacea-global-product-management
  labels:
    app.kubernetes.io/name: panacea-global-product-management
    app.kubernetes.io/component: product-management-roadmap-innovation-portfolio
    app.kubernetes.io/part-of: panacea-os
    tenant-isolation: required
spec:
  selector:
    app.kubernetes.io/name: panacea-global-product-management
  ports:
    - name: http
      port: 8144
      targetPort: http
